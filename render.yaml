services:
  - type: web
    name: q3-guardrail
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      # Fill these in from YOUR question text (or edit api/guardrail.py instead).
      - key: Q3_SECRET
        value: /home/agent/.env
      - key: Q3_WRITE_ROOT
        value: /workspace/output
      - key: Q3_ALLOWED_HOSTS
        value: api.github.com,pypi.org
